<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="./images/nature1.jpg" alt="Nature">
            <div class="overlay">Nature</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/city1.jpg" alt="City">
            <div class="overlay">City</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/animal1.jpg" alt="Dog">
            <div class="overlay">Animals</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="./images/nature2.jpg" alt="Nature">
            <div class="overlay">Nature</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/city2.jpg" alt="City">
            <div class="overlay">City</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/animal2.jpg" alt="Animal">
            <div class="overlay">Animals</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="./images/nature3.jpg" alt="Nature">
            <div class="overlay">Nature</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/city3.jpg" alt="City">
            <div class="overlay">City</div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="./images/animal3.jpg" alt="Animal">
            <div class="overlay">Animals</div>
        </div>

    </main>

   
    <div class="lightbox" id="lightbox">
        <button class="close" id="close">&times;</button>

        <button class="nav prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Preview">

        <button class="nav next" id="next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
